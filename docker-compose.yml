version: '3.8'
services:
  supabase-db:
    image: supabase/postgres:14.1.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: Tiger1234
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: 2f6af974c65cea8d6634f45f171fce93b1b58012d905a4cd449d8f5b671ae364
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
      SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q

  auth:
    image: supabase/gotrue:v2.90.0
    depends_on:
      - supabase-db
    environment:
      DATABASE_URL: postgres://postgres:Tiger1234@supabase-db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: 2f6af974c65cea8d6634f45f171fce93b1b58012d905a4cd449d8f5b671ae364
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_HOST: supabase-db
      GOTRUE_DB_PORT: 5432
      GOTRUE_DB_NAME: postgres
      GOTRUE_DB_USER: postgres
      GOTRUE_DB_PASSWORD: Tiger1234
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_USER: fake_mail_user
      GOTRUE_SMTP_PASS: fake_mail_password
      GOTRUE_SMTP_SENDER_NAME: Supabase
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: DEBUG
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ADDITIONAL_REDIRECT_URLS: "${ADDITIONAL_REDIRECT_URLS}"
      JWT_EXPIRY: 3600
      DISABLE_SIGNUP: "false"
    ports:
      - "9999:9999"

  supabase-studio:
    image: supabase/studio:latest
    depends_on:
      - supabase-db
      - auth
      - rest
      - kong
    ports:
      - "3000:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: Tiger1234
      DEFAULT_ORGANIZATION: OctoSoft
      DEFAULT_PROJECT: crm
      SUPABASE_URL: http://kong:8000
      SUPABASE_REST_URL: http://kong:8000/rest/v1/
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      STUDIO_PG_META_CACHE: "false"

  kong:
    image: kong:2.8.1
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro

  meta:
    image: supabase/postgres-meta:v0.68.0
    depends_on:
      - supabase-db
    ports:
      - "8080:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PASSWORD: Tiger1234

  mail:
    image: inbucket/inbucket:3.0.3
    ports:
      - "2500:2500"
      - "9000:9000"

  rest:
    image: postgrest/postgrest:v10.1.1
    depends_on:
      - supabase-db
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:Tiger1234@supabase-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: 2f6af974c65cea8d6634f45f171fce93b1b58012d905a4cd449d8f5b671ae364
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
      PGRST_LOG_LEVEL: info
